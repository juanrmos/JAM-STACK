# API administrativa de producción. El Worker se crea antes que su aplicación
# Access; sus rutas privadas fallan cerradas mientras falte CF_ACCESS_AUD.
name = "portafolio-api-admin"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[vars]
R2_BUCKET_NAME = "portafolio-archivos"
R2_BUCKET_ENDPOINT = "4958e9a41e2a0e9ae326dc46e79c7a79.r2.cloudflarestorage.com"
R2_PUBLIC_URL = "https://pub-8d2d800097a241338f88eaa4a77ad190.r2.dev"
CF_ACCESS_TEAM = "wild-pond-b1e4"
CF_ACCESS_AUD = "a9080380af99f117b1f015f2c91a0a5ab91d358ca93b88d5d879471bc6633e3c"
FRONTEND_ORIGIN = "https://portafolio-front.pages.dev"
# Las URLs inmutables de Pages de este mismo proyecto usan el mismo Access.
ALLOW_PAGES_PREVIEW_ORIGINS = "true"
# ADMIN_SECRET, JWT_SECRET y las credenciales R2 se guardan como secretos del Worker.

[[d1_databases]]
binding = "DB"
database_name = "portafolio-db"
database_id = "55bd3fbf-fe42-42e1-85e1-a7f0a051b513"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "portafolio-archivos"

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1"
simple = { limit = 30, period = 60 }
