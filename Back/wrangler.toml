# ---- Worker: portafolio-api ----
# Referencia: doc 04 (stack), skill jam (principio 5)

name = "portafolio-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[vars]
R2_BUCKET_NAME = "portafolio-archivos"
API_PUBLIC_ONLY = "true"

# --- D1 Database (metadata de obras) ---
[[d1_databases]]
binding = "DB"
database_name = "portafolio-db-contenido-candidato-2026-10-23"
database_id = "3eb95e22-5657-4841-9a11-047eaa5fe746"
migrations_dir = "migrations-production"

# --- R2 Bucket (fotos de obras) ---
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "portafolio-archivos"

# --- Rate Limiter (skill deep-security, principio 7) ---
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1"
simple = { limit = 30, period = 60 } # 30 peticiones por minuto por identidad
